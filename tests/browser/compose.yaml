services:
  translator:
    image: cot-to-vmf:local
    command: [run, --workspace, /var/lib/cot-to-vmf, --cot-listen,
              "0.0.0.0:9001", --vmf-target, "collector:9002", --web,
              "0.0.0.0:8080", --log-format, json]
    volumes:
      - workspace:/var/lib/cot-to-vmf
    restart: "no"
    stop_grace_period: 5s
    depends_on: [collector]
  collector:
    image: cot-vmf-browser:local
    command: [node, -e, "require('node:dgram').createSocket('udp4').bind(9002, '0.0.0.0')"]
    restart: "no"
  browser:
    image: cot-vmf-browser:local
    environment:
      TRANSLATOR_URL: http://translator:8080
      COT_HOST: translator
      COT_PORT: "9001"
    depends_on: [translator]
    init: true
    shm_size: 512mb
    restart: "no"
volumes:
  workspace:
